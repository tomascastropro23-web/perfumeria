<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Perfumería Premium</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Navegación -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">✨ Perfumería Premium</h1>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="informacion.html">Información</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contacto -->
    <section class="contact-section">
        <div class="contact-container">
            <h2>Contacta con Nosotros</h2>
            
            <div class="contact-info">
                <div class="contact-item">
                    <h3>📍 Ubicación</h3>
                    <p>Calle Principal 123<br>Ciudad, CP 28001<br>España</p>
                </div>
                <div class="contact-item">
                    <h3>📱 Teléfono</h3>
                    <p><a href="tel:+34912345678">+34 91 234 56 78</a></p>
                </div>
                <div class="contact-item">
                    <h3>✉️ Email</h3>
                    <p><a href="mailto:info@perfumeriapremium.es">info@perfumeriapremium.es</a></p>
                </div>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" required>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar Mensaje</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Perfumería Premium. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
